name: Build M32 Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # This will actually find a server now
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          # We install gcc-aarch64-linux-gnu which is the standard cross-compiler on newer Ubuntu
          sudo apt-get install -y bc bison build-essential flex git-core libssl-dev libncurses-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export SHELL=/bin/bash
          
          # Clean up
          make clean
          make mrproper
          
          # Setup Config
          make m32_defconfig
          
          # Neutralize the missing kperfmon files (the fix from before)
          sed -i 's/CONFIG_KPERFMON=y/CONFIG_KPERFMON=n/g' .config
          
          # Bake it!
          make -j$(nproc)
          
      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: M32-Kernel-Output
          path: arch/arm64/boot/Image.gz-dtb
