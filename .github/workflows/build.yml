- name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export SHELL=/bin/bash
          export CONFIG_SHELL=/bin/bash
          
          make clean
          make mrproper
          
          # 1. Generate the initial config
          make m32_defconfig
          
          # 2. Apply our "Magic Fixes" to the .config file
          # Disable the security check that crashed it before
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' .config
          # Disable the missing Samsung monitor
          sed -i 's/CONFIG_KPERFMON=y/CONFIG_KPERFMON=n/g' .config
          
          # 3. NEW CRUCIAL STEP: This tells the builder to accept our changes 
          # and not stop to ask questions.
          make olddefconfig
          
          # 4. Bake the kernel
          make -j$(nproc)
