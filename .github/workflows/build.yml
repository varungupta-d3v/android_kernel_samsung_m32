name: Build M32 Kernel
on:
  push:
    branches: [ TWRP_11_Staging ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git-core libssl-dev libncurses-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          # 1. GLOBAL SHELL FIX: Force the system to use bash instead of sh
          sudo rm /bin/sh && sudo ln -s /bin/bash /bin/sh
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Clean environment
          make clean
          make mrproper
          
          # 2. Generate config
          make m32_defconfig
          
          # 3. Magic Fixes for Samsung/MediaTek hurdles
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' .config
          sed -i 's/CONFIG_KPERFMON=y/CONFIG_KPERFMON=n/g' .config
          
          # 4. Enable USB Webcam (UVC) Support
          echo "CONFIG_USB_CONFIGFS_F_UVC=y" >> .config
          echo "CONFIG_USB_F_UVC=y" >> .config
          echo "CONFIG_VIDEO_V4L2=y" >> .config
          
          # 5. Sync the config changes
          make olddefconfig
          
          # 6. Start the build
          make -j$(nproc)
          
      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: M32-Kernel-Output
          path: arch/arm64/boot/Image.gz-dtb
