name: Build M32 Kernel
on:
  workflow_dispatch: # This gives you the manual "Run" button

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # This line fixes the Node.js 20 warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git-core libssl-dev libncurses-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # First, clean any old failed attempts
          make clean
          make mrproper
          # Load your specific M32 instructions
          make m32_defconfig
          # Start the build (using all available CPU cores)
          make -j$(nproc)
          
      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: M32-Kernel-Output
          path: arch/arm64/boot/Image.gz-dtb
